[gcode_macro PRINT_START]
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}

    G90                                         ; Set to absolute positioning for X/Y/Z
    M83                                         ; Set extruder (E) to relative mode
    M104 S170                                   ; Warm extruder to non-ooze pre-melt temp
    M140 S{BED_TEMP}                            ; Start heating bed
    G28                                         ; Home all axes
    M190 S{BED_TEMP}                            ; Wait for bed to reach temperature
    G29                                         ; Or BED_MESH_CALIBRATE / BED_MESH_PROFILE LOAD=default
    M109 S{EXTRUDER_TEMP}                       ; Wait for extruder to reach printing temperature
    G92 E0                                      ; Reset Extruder
    G1 F1800 E-1                                ; Retract filament 1mm to prevent oozing
    ;M300 S1000 P500                             ; Chirp to indicate starting to print
    PRIME

[gcode_macro PRINT_END]
gcode:
    G91                                         ; Relative positioning
    G1 E-8 F2700                                ; Retract a bit
    G1 E-2 Z0.2 F2400                           ; Retract and raise Z
    G1 X5 Y5 F3000                              ; Wipe out
    G1 Z25                                      ; Raise Z more
    G90                                         ; Absolute positioning
    G1 X200 Y200                                ; Present print
    M106 S0                                     ; Turn-off fan
    M104 S0                                     ; Turn-off hotend
    M140 S0                                     ; Turn-off bed
    M84 X Y E                                   ; Disable all steppers but Z
    ;M300 S440 P200                              ; Make Print Completed Tones
    ;M300 S660 P250
    ;M300 S880 P300

[gcode_macro PRIME]
gcode:
    G1 X0 Y210 Z0.8 F5000
    G1 Y180 E30 F150
    G1 Y30 Z0.2 F1500
    G1 Y20 Z0 F1500
    G1 Z0.8
    G92 E0
    
[gcode_macro _DUMMY_POWER]
gcode:
  M117 Power toggled
  
[gcode_macro G29]
description: "Generate bed mesh"
gcode:
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=5
    G0 X0 Y{max_y} Z10 F6000

[output_pin beeper_pin]
pin: PC5
pwm: True 
value: 0
shutdown_value: 0
cycle_time: 0.001 # 1ms cycle time for a tone (1kHz)

[gcode_macro BEEP]
gcode:
    # Usage: BEEP P<duration_ms>
    {% set P = params.P|default(100)|int %} ; Duration in ms, default 100ms
    SET_PIN PIN=beeper_pin VALUE=1 
    G4 P{P} ; Wait for the duration
    SET_PIN PIN=beeper_pin VALUE=0

[gcode_macro M300]
gcode:
    # Use a default 1kHz tone (from cycle_time) if S is omitted.
    {% set S = params.S|default(1000)|int %}
    # Use a 100ms duration if P is omitted.
    {% set P = params.P|default(100)|int %}
    
    SET_PIN PIN=beeper_pin VALUE=0.5 CYCLE_TIME={ 1.0/S if S > 0 else 1 } 
    G4 P{P} 
    SET_PIN PIN=beeper_pin VALUE=0

# gecko coolplate
[gcode_macro M140]
rename_existing: M140.1
gcode:
    {% set S = params.S|default(0)|float %}
    {% if S > 0 %}
        RESPOND MSG="M140 S{S} received, ignoring as bed heating is disabled."
    {% endif %}

[gcode_macro M190]
rename_existing: M190.1
gcode:
    {% set S = params.S|default(0)|float %}
    RESPOND MSG="M190 S{S} received, ignoring and proceeding immediately."

[gcode_macro DUMP_VARIABLES]
description: "Show all variables in Klipper env"
gcode:
    {% set filter_name = params.NAME|default('')|string|lower %}
    {% set filter_value = params.VALUE|default('')|string|lower %}
    {% set show_cfg = params.SHOW_CFG|default(0)|int %}
    {% set out = [] %}
    {% for key1 in printer %}
        {% for key2 in printer[key1] %}
            {% if (show_cfg or not (key1|lower == 'configfile' and key2|lower in ['config', 'settings'])) and (filter_name in key1|lower or filter_name in key2|lower) and filter_value in printer[key1][key2]|string|lower %}
                {% set dummy = out.append("printer['%s'].%s = %s" % (key1, key2, printer[key1][key2])) %}
            {% endif %}
        {% else %}
            {% if filter_name in key1|lower and filter_value in printer[key1]|string|lower %}
                {% set dummy = out.append("printer['%s'] = %s" % (key1, printer[key1])) %}
            {% endif %}
        {% endfor %}
    {% endfor %}
    {action_respond_info(out|join("\n"))}

[gcode_macro LOAD_FILAMENT]
variable_load_distance: 700        # Distance to load filament into the extruder
variable_purge_distance: 50        # Distance to purge filament after loading
variable_nozzle_preheat_temp: 200  # Default preheat temperature for the nozzle
variable_turn_off_extruder: False  # Option to turn off the extruder after loading (True/False)
gcode:
    # Parameters and settings
    {% set load_speed = params.LOAD_SPEED|default(600) %}  # Speed in mm/min for fast filament loading
    {% set purge_speed = params.PURGE_SPEED|default(300) %}  # Speed in mm/min for purging filament
    {% set target_temp = params.TARGET_TEMP|default(nozzle_preheat_temp) %}  # Target temperature for the nozzle
    {% set min_temp = params.MIN_TEMP|default(200) %}  # Minimum safe temperature for extrusion

    # Save current state of the printer
    SAVE_GCODE_STATE NAME=load_state

    # Heat directly to the target temperature if it's above the minimum temperature
    {% if target_temp >= min_temp %}
        M104 S{target_temp} ; Set extruder to target temperature
        M109 S{target_temp} ; Wait for extruder to reach target temperature
    {% else %}
        # Heat to minimum temperature first if target is too low
        M104 S{min_temp} ; Set extruder to safe minimum temperature
        M109 S{min_temp} ; Wait for extruder to reach safe minimum temperature
    {% endif %}

    # Begin filament loading process
    G91 ; Set relative positioning for extrusion
    G92 E0 ; Reset extruder position
    G1 E{load_distance} F{load_speed} ; Load filament at the specified loading speed
    G1 E{purge_distance} F{purge_speed} ; Purge filament at the slower purging speed

    # Optionally turn off the extruder heater after loading
    {% if turn_off_extruder %}
        M104 S0 ; Turn off extruder heater
    {% endif %}

    # Restore previous state of the printer
    G90 ; Restore absolute positioning
    RESTORE_GCODE_STATE NAME=load_state

    # Completion message
    M117 Filament load complete
    
[gcode_macro UNLOAD_FILAMENT]
variable_unload_distance: 750      # Distance to retract filament from the extruder
variable_nozzle_preheat_temp: 200  # Default preheat temperature for unloading
variable_turn_off_extruder: False  # Option to turn off the extruder after unloading (True/False)
gcode:
    # Parameters and settings
    {% set retract_speed = params.RETRACT_SPEED|default(600) %}  # Speed for retracting filament
    {% set target_temp = params.TARGET_TEMP|default(nozzle_preheat_temp) %}  # Target temperature for the nozzle
    {% set min_temp = params.MIN_TEMP|default(200) %}  # Minimum safe temperature for extrusion

    # Save current state of the printer
    SAVE_GCODE_STATE NAME=unload_state

    # Heat the nozzle to the target temperature if required
    {% if printer.extruder.temperature < target_temp %}
        # Ensure the nozzle is heated to the target temperature or at least the minimum safe temperature
        {% if target_temp >= min_temp %}
            M104 S{target_temp} ; Set extruder to target temperature
            M109 S{target_temp} ; Wait for extruder to reach target temperature
        {% else %}
            M104 S{min_temp} ; Set extruder to safe minimum temperature
            M109 S{min_temp} ; Wait for extruder to reach safe minimum temperature
        {% endif %}
    {% endif %}

    # Begin filament unloading process
    G91 ; Set relative positioning for extrusion
    G92 E0 ; Reset extruder position
    G1 E-{unload_distance} F{retract_speed} ; Retract filament at the specified speed

    # Optionally turn off the extruder heater after unloading
    {% if turn_off_extruder %}
        M104 S0 ; Turn off extruder heater
    {% endif %}

    # Restore previous state of the printer
    G90 ; Restore absolute positioning
    RESTORE_GCODE_STATE NAME=unload_state

    # Completion message
    M117 Filament unload complete

