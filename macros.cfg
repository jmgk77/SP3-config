[gcode_macro T0]
gcode:
    # Deactivate stepper in my_extruder_stepper
    SYNC_EXTRUDER_MOTION EXTRUDER=belted_extruder MOTION_QUEUE=
    # Activate stepper in extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder

[gcode_macro T1]
gcode:
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=
    # Activate stepper in my_extruder_stepper
    SYNC_EXTRUDER_MOTION EXTRUDER=belted_extruder MOTION_QUEUE=extruder

[gcode_macro G29]
description: "Generate bed mesh"
gcode:
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=5
    G0 X0 Y0 Z10 F6000

[output_pin beeper_pin]
pin: PC5
pwm: True 
value: 0
shutdown_value: 0
cycle_time: 0.001 # 1ms cycle time for a tone (1kHz)

[gcode_macro BEEP]
gcode:
    # Usage: BEEP P<duration_ms>
    {% set P = params.P|default(100)|int %} ; Duration in ms, default 100ms
    SET_PIN PIN=beeper_pin VALUE=1 
    G4 P{P} ; Wait for the duration
    SET_PIN PIN=beeper_pin VALUE=0

[gcode_macro M300]
gcode:
    # Use a default 1kHz tone (from cycle_time) if S is omitted.
    {% set S = params.S|default(1000)|int %}
    # Use a 100ms duration if P is omitted.
    {% set P = params.P|default(100)|int %}
    
    SET_PIN PIN=beeper_pin VALUE=0.5 CYCLE_TIME={ 1.0/S if S > 0 else 1 } 
    G4 P{P} 
    SET_PIN PIN=beeper_pin VALUE=0

# gecko coolplate
[gcode_macro M140]
rename_existing: M140.1
gcode:
    {% set S = params.S|default(0)|float %}
    {% if S > 0 %}
        RESPOND MSG="M140 S{S} received, ignoring as bed heating is disabled."
    {% endif %}

[gcode_macro M190]
rename_existing: M190.1
gcode:
    {% set S = params.S|default(0)|float %}
    RESPOND MSG="M190 S{S} received, ignoring and proceeding immediately."

