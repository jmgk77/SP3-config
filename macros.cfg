[gcode_macro PRINT_START]
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}

    G90                                         ; Set to absolute positioning for X/Y/Z
    M83                                         ; Set extruder (E) to relative mode
    M104 S170                                   ; Warm extruder to non-ooze pre-melt temp
    M140 S{BED_TEMP}                            ; Start heating bed
    G28                                         ; Home all axes
    M190 S{BED_TEMP}                            ; Wait for bed to reach temperature
    G29                                         ; Or BED_MESH_CALIBRATE / BED_MESH_PROFILE LOAD=default
    M109 S{EXTRUDER_TEMP}                       ; Wait for extruder to reach printing temperature
    G92 E0                                      ; Reset Extruder
    G1 F1800 E-1                                ; Retract filament 1mm to prevent oozing
    ;M300 S1000 P500                             ; Chirp to indicate starting to print
    PRIME

[gcode_macro PRINT_END]
gcode:
    G91                                         ; Relative positioning
    G1 E-8 F2700                                ; Retract a bit
    G1 E-2 Z0.2 F2400                           ; Retract and raise Z
    G1 X5 Y5 F3000                              ; Wipe out
    G1 Z25                                      ; Raise Z more
    G90                                         ; Absolute positioning
    G1 X200 Y200                                ; Present print
    M106 S0                                     ; Turn-off fan
    M104 S0                                     ; Turn-off hotend
    M140 S0                                     ; Turn-off bed
    M84 X Y E                                   ; Disable all steppers but Z
    ;M300 S440 P200                              ; Make Print Completed Tones
    ;M300 S660 P250
    ;M300 S880 P300

[gcode_macro PRIME]
gcode:
    G1 X0 Y210 Z0.8 F5000
    G1 Y180 E30 F150
    G1 Y30 Z0.2 F1500
    G1 Y20 Z0 F1500
    G1 Z0.8
    G92 E0
    
[gcode_macro _DUMMY_POWER]
gcode:
  M117 Power toggled

[gcode_macro POWER_OFF]
description: "CYD_SCREEN_MACRO"
gcode:
	_DUMMY_POWER
  
[gcode_macro G29]
description: "Generate bed mesh"
gcode:
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=5
    G0 X0 Y{max_y} Z10 F6000

